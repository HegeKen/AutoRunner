name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # 在 GitHub 上「创建/发布 Release」不会触发 push 的 tag 事件（UI 建 tag 不发 push，
  # 且本项目 Release tag 为 1.0.0 并不匹配 v*），因此必须显式订阅 release 事件。
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # 需要 write 才能把 APK 作为附件上传到 Release。
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 签名材料来自 Secrets（与仓库其他项目同名）。gradle 侧在检测到
    # ANDROID_KEYSTORE_BASE64 时会把 base64 解码到 build 目录下的临时 keystore 并使用。
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platform-tools
            platforms;android-37.0
            build-tools;35.0.1
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 正式发布必须使用真实签名，避免缺 Secrets 时静默回退到 debug 密钥。
      - name: Require release signing secrets
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 等签名 Secrets，无法产出正式签名 APK"
            exit 1
          fi

      - name: Build signed release APK
        run: ./gradlew :autorunner-app:assembleRelease --console=plain

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK=autorunner-app/build/outputs/apk/release/autorunner-app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: autorunner-release-apk
          path: autorunner-app/build/outputs/apk/release/*.apk
          retention-days: 7

      # 由 Release 事件触发时，把 APK 作为附件挂到该 Release 上（--clobber 允许重跑覆盖）。
      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=autorunner-app/build/outputs/apk/release/autorunner-app-release.apk
          gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
