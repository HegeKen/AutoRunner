# ---------------------------------------------------------------------------
# AutoRunner — Gradle configuration
# ---------------------------------------------------------------------------

# JVM：支持的工具链为 JDK 21（见 docs/DEVELOPMENT.md）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36,37,37.0

# ---------------------------------------------------------------------------
# 应用版本（单一来源 / single source of truth）
# 修改这里即可联动：APK 的 versionName/versionCode、应用内「关于」页、root-module。
# 升级时请同步在 CHANGELOG.md 顶部新增条目。
# ---------------------------------------------------------------------------
autorunner.versionName=1.1.0
autorunner.versionCode=11

# 小米超级岛 / 焦点通知（可选）：在小米开放平台创建应用并启用「小米超级岛」后，
# 将分配的 APP_ID 填到这里（或构建时传 -Pautorunner.xiaomiXmsAppId=...）。
# 不填时不会投递超级岛焦点通知；填写后需在平台完成包名 / 签名与设备白名单配置。
# autorunner.xiaomiXmsAppId=

# Kotlin Multiplatform
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# 部分沙盒环境无法使用 Kotlin 守护进程，改为进程内编译。
kotlin.compiler.execution.strategy=in-process
