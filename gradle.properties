# ---------------------------------------------------------------------------
# AutoRunner — Gradle configuration
# ---------------------------------------------------------------------------

# JVM: JDK 21 is the supported toolchain (see docs/DEVELOPMENT.md).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36,37,37.0

# TEMPORARY: AGP 9.x 默认只暴露新版 DSL，且内置 Kotlin 支持会与 KMP 插件冲突，导致
# com.android.application / com.android.library 与 org.jetbrains.kotlin.multiplatform 在同一
# 模块无法共存。以下两个开关临时绕过，使依赖（Compose 1.12+ 等）所需的 AGP 9.x 可用。
# 它们会在 AGP 10 移除，届时须迁移到 com.android.kotlin.multiplatform.library 并拆分 Android
# 入口模块。详见 https://kotlinlang.org/docs/multiplatform/multiplatform-project-agp-9-migration.html
android.builtInKotlin=false
android.newDsl=false

# ---------------------------------------------------------------------------
# 应用版本（单一来源 / single source of truth）
# 修改这里即可联动：APK 的 versionName/versionCode、应用内「关于」页、root-module。
# 升级时请同步在 CHANGELOG.md 顶部新增条目。
# ---------------------------------------------------------------------------
autorunner.versionName=1.0.1
autorunner.versionCode=3

# Kotlin Multiplatform
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# The Kotlin daemon is unavailable in some sandboxed environments; compile in-process.
kotlin.compiler.execution.strategy=in-process
